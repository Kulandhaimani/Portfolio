<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #left{
            text-shadow: -5px 0 0 red;
        }
        #right{
            text-shadow: 5px 0 0 blue;
        }
        #top{
            text-shadow: 0 -5px 0 orange;
        }
        #bottom{
            text-shadow: 0 5px 0 green;
        }
        #blur{
            text-shadow: 0 0 5px darkkhaki;
        }
        #color{
            text-shadow: 5px -5px 0 lavender;
        }
        #combine{
            text-shadow: 5px 5px 5px violet;
        }
    </style>
</head>
<body>
    <h1>Text Shadow</h1>
    <h2 id="left">Left Shadow</h2>
     <h2 id="right">Right Shadow</h2>
      <h2 id="top">Top Shadow</h2>
       <h2 id="bottom">Bottom Shadow</h2>
        <h2 id="blur">Shadow blurring</h2>
          <h2 id="color">Shadow color</h2>
            <h2 id="combine">Combine everything</h2>
        
    
</body>
</html>
