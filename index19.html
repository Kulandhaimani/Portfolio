<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Table</title>

    <style>
        body{
            font-family: Arial, sans-serif;
        }

        table{
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        table, th, td{
            border: 2px solid black;
        }

        th, td{
            padding: 15px;
            text-align: center;
        }

        th{
            background-color: royalblue;
            color: white;
        }
    </style>
</head>

<body>

    </tr>
