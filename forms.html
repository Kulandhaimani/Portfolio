    <body>
        <h1>Forms</h1>
        <h2>Login form</h2>
        <form methods="get" enctype="multipart/form.data">
            <p>
                <label> Username :</label><input type="text" placeholder="Enter your username" name="username" value="admin" size="10" maxlength="20">
            </p>
              <p>
                <label> Password :</label><input type="password" placeholder="Enter your password" name="password" size="10" maxlength="10">
            </p>
            <p><label>Comments:</label><textarea type="text" placeholder="Enter your comments..." name="comments" cols="25"rows="5"></textarea>
            </p>
            <p>

            <input type="radio" name="learnfirst" id="javascript" value="javascript" checked><label for="javascript">Javascript</label>
            </p>
            <p>
