<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display property</title>
    <style>
        p{
            height: 100px;
            width: 100px;
            border: 2px solid red;
            padding:10px;
            margin: 20px auto;
        }
        #top{
            box-shadow: -5px -5px 0 0 blue;
        }
        #bottom{
            box-shadow: 5px 5px 0 0 palevioletred;
            border-radius: 10px 10px 10px 10px;
        }
        #spread{
            box-shadow: 5px 5px 0 5px gold;
            border-radius: 10px 0 10px o;
        }
        #outer{
            box-shadow: 0 0 0 5px orangered;
            border-radius: 20px 40px;
        }
        #inset{
            box-shadow: inset 0 0 5px 5px dodgerblue;
            border-radius: 100px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>box shadow</h1>
    <p id="top">Top left</p>
    <p id="bottom">Bottom right</p>
    <p id="spread">Bottom right spread</p>
    <p id="outer">outer spread</p>
    <p id="inset">Inset</p>
</body>
</html>
